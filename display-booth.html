<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Display Booth — PTSP KUA Pilangkenceng</title>
<style>
  :root{
    --hijau-tua:   #0B4432;
    --hijau:       #10593F;
    --hijau-muda:  #1B7A56;
    --emas:        #C9A24B;
    --emas-terang: #E6C878;
    --krem:        #F4EFE2;
    --teks:        #F4EFE2;
    --teks-redup:  #9FC2AE;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{
    width:100vw;height:100vh;overflow:hidden;
    background:var(--hijau-tua);
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  }
  .stage{
    display:grid;
    grid-template-columns:60% 40%;
    width:100vw;height:100vh;
  }

  /* ===== KIRI — LAYANAN TERBARU + RUNNING TEXT ===== */
  .panel-info{
    position:relative;
    display:flex;flex-direction:column;
    background:
      radial-gradient(circle at 12% 8%, rgba(230,200,120,0.10), transparent 45%),
      linear-gradient(200deg, var(--hijau) 0%, var(--hijau-tua) 65%);
    overflow:hidden;
    border-right:3px solid var(--emas);
  }
  .panel-info::before{
    content:"";
    position:absolute;inset:0;
    opacity:.05;
    background-image:
      repeating-radial-gradient(circle at 0 0, transparent 0, transparent 38px, var(--emas-terang) 39px, transparent 40px);
    background-size:80px 80px;
    pointer-events:none;
  }

  .info-header{
    padding:2vh 2.2vw 1.2vh;
    border-bottom:1px solid rgba(230,200,120,0.25);
    position:relative;z-index:1;
  }
  .info-title{
    font-size:1.7vw;font-weight:700;color:var(--teks);
    letter-spacing:.01em;
  }

  /* ===== VIDEO PROFIL / FOOTAGE YOUTUBE KUA ===== */
  .video-wrap{
    flex:1.5 1 0;
    min-height:0;
    position:relative;z-index:1;
    padding:1.8vh 2.2vw 0;
    display:flex;
  }
  .video-frame{
    position:relative;width:100%;height:100%;
    border-radius:.8vw;overflow:hidden;
    border:1px solid rgba(230,200,120,0.35);
    box-shadow:0 1vh 2.5vh rgba(0,0,0,.25);
    background:#000;
  }
  .video-frame video{
    position:absolute;top:0;left:0;
    width:100%;height:100%;
    object-fit:cover;
    display:block;
    background:#000;
  }

  .info-body{
    flex:1 1 0;min-height:0;
    display:flex;align-items:center;justify-content:space-between;gap:1.6vw;
    padding:1.6vh 2.2vw;position:relative;z-index:1;
    opacity:1;transition:opacity .4s ease;
  }
  .info-body.fading{opacity:0}
  .slide-dots{
    display:flex;gap:.5vw;justify-content:center;
    padding:0 0 1.2vh;position:relative;z-index:1;
  }
  .slide-dots span{
    width:.6vw;height:.6vw;border-radius:50%;
    background:rgba(230,200,120,0.3);
    transition:background .3s ease;
  }
  .slide-dots span.aktif{background:var(--emas-terang)}
  .info-body-teks{
    flex:1 1 0;min-width:0;
    display:flex;flex-direction:column;gap:.8vh;
  }
  .info-body-foto{
    flex:0 0 auto;
    width:38%;aspect-ratio:4/3;
    border-radius:.7vw;overflow:hidden;
    border:1px solid rgba(230,200,120,0.35);
    box-shadow:0 1vh 2.5vh rgba(0,0,0,.25);
    background:rgba(0,0,0,.2);
    display:flex;align-items:center;justify-content:center;
  }
  .info-body-foto img{
    width:100%;height:100%;object-fit:cover;display:block;
  }
  .info-body-foto .foto-kosong{
    font-size:.75vw;color:var(--teks-redup);text-align:center;padding:1vw;
  }
  .kartu-nomor{
    font-size:2.6vw;font-weight:800;color:var(--emas-terang);
    line-height:1;letter-spacing:.01em;
    text-shadow:0 0.2vh 1.2vh rgba(230,200,120,.25);
  }
  .kartu-nama{
    font-size:1.5vw;font-weight:700;color:var(--teks);line-height:1.25;
  }
  .kartu-jenis{
    display:inline-block;
    margin-top:.5vh;
    padding:.6vh 1vw;
    font-size:.85vw;font-weight:600;color:var(--hijau-tua);
    background:var(--emas-terang);
    border-radius:999px;
  }
  .kartu-waktu{
    font-size:.75vw;color:var(--teks-redup);margin-top:.5vh;
  }

  .marquee-wrap{
    border-top:1px solid rgba(230,200,120,0.25);
    background:rgba(0,0,0,0.18);
    padding:1.6vh 0;
    overflow:hidden;
    position:relative;z-index:1;
    white-space:nowrap;
  }
  /* Track berisi 2 salinan teks identik berdampingan (lihat markup).
     Animasi cuma geser 50% lebar track, jadi begitu sampai titik itu
     tampilannya SAMA PERSIS dengan posisi awal -> loop tanpa jeda/space
     kosong. Jarak antar salinan diatur via padding-right di tiap <span>,
     bukan cuma spasi teks biasa, supaya jeda visualnya konsisten lebar. */
  .marquee-track{
    display:inline-flex;
    animation:scroll-left 42s linear infinite;
    will-change:transform;
  }
  .marquee-track span{
    display:inline-block;
    padding-right:8vw;
    font-size:1.25vw;font-weight:600;color:var(--teks);
    letter-spacing:.02em;
    white-space:nowrap;
  }
  .marquee-track b{color:var(--emas-terang);font-weight:800}
  @keyframes scroll-left{
    0%{transform:translateX(0)}
    100%{transform:translateX(-50%)}
  }

  .clock{
    position:absolute;top:2.2vh;right:2.2vw;z-index:2;
    text-align:right;font-variant-numeric:tabular-nums;
  }
  .clock .jam{font-size:1.3vw;font-weight:700;color:var(--emas-terang)}
  .clock .tgl{font-size:.7vw;color:var(--teks-redup)}

  .kosong{
    font-size:1.2vw;color:var(--teks-redup);font-style:italic;
  }

  /* ===== KANAN — POSTER (iframe, chrome disembunyikan via injeksi CSS) ===== */
  .panel-poster{
    position:relative;
    background:var(--hijau-tua);
    display:flex;align-items:stretch;justify-content:center;
    overflow:hidden;
  }
  .panel-poster iframe{
    width:100%;height:100%;border:0;display:block;
    opacity:0;transition:opacity .5s ease;
  }
  .panel-poster iframe.ready{opacity:1}

  @media (max-width:900px){
    .stage{grid-template-columns:1fr}
    .panel-info{height:40vh}
    .panel-poster{height:60vh}
  }
</style>
</head>
<body>

<div class="stage">

  <!-- KIRI: Layanan terbaru + running text -->
  <section class="panel-info">
    <div class="clock">
      <div class="jam" id="jamSkrg">--:--</div>
      <div class="tgl" id="tglSkrg">-</div>
    </div>

    <div class="info-header">
      <div class="info-title">PTSP KUA Pilangkenceng</div>
    </div>

    <!-- Video profil KUA Pilangkenceng — asset LOKAL (bukan YouTube), supaya
         tidak tergantung koneksi internet. preload="auto" supaya browser
         langsung buffer video begitu halaman dibuka (device nyala terus). -->
    <div class="video-wrap">
      <div class="video-frame">
        <video
          id="videoProfil"
          autoplay muted loop playsinline preload="auto">
          <source src="assets/video-profil-kua.mp4" type="video/mp4">
        </video>
      </div>
    </div>

    <div class="info-body" id="infoBody">
      <div class="kosong">Memuat data layanan…</div>
    </div>
    <div class="slide-dots" id="slideDots"></div>

    <div class="marquee-wrap">
      <div class="marquee-track" id="marqueeTrack">
        <span id="marqueeText">Selamat Datang di PTSP KUA Kecamatan Pilangkenceng</span>
        <span id="marqueeText2" aria-hidden="true">Selamat Datang di PTSP KUA Kecamatan Pilangkenceng</span>
      </div>
    </div>
  </section>

  <!-- KANAN: Poster Pengumuman Kehendak Nikah (halaman publik yang sudah ada) -->
  <section class="panel-poster">
    <iframe
      id="posterFrame"
      src="pengumumankehendaknikah.html"
      title="Poster Pengumuman Kehendak Nikah"
      loading="eager"></iframe>
  </section>

</div>

<script>
(function(){
  // ── ID deployment TERVERIFIKASI dari config production (pengumumankehendaknikah.html) ──
  const API_URL = 'https://script.google.com/macros/s/AKfycbzJNO6PqGKH5AGpnaK_yJXPvqpdoVAkHpFZAVGXF57vDD8VavkCOG0smsF56nWquX3b/exec';
  const POLL_MS   = 15000; // ambil data terbaru dari server tiap 15 detik
  const SLIDE_MS  = 6000;  // ganti kartu yang ditampilkan tiap 6 detik

  function tickClock(){
    const now = new Date();
    document.getElementById('jamSkrg').textContent =
      now.toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit' });
    document.getElementById('tglSkrg').textContent =
      now.toLocaleDateString('id-ID', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
  }
  tickClock();
  setInterval(tickClock, 15000);

  async function fetchJsonRetry(url, tries){
    tries = tries || 2;
    for (let i = 0; i < tries; i++){
      try{
        const res = await fetch(url + (url.indexOf('?') > -1 ? '&' : '?') + '_=' + Date.now(), { cache:'no-store' });
        const text = await res.text();
        return JSON.parse(text);
      }catch(err){
        if (i === tries - 1) throw err;
        await new Promise(r => setTimeout(r, 1200));
      }
    }
  }

  function fmtWaktu(iso){
    if (!iso) return '';
    try{
      const d = new Date(iso);
      return d.toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit' }) + ' WIB';
    }catch(e){ return ''; }
  }

  let daftarLayanan = []; // hasil terbaru dari server (maks 5)
  let slideIdx = 0;

  async function refresh(){
    try{
      const json = await fetchJsonRetry(API_URL + '?action=getlatestlayanan');
      if (!json || !json.ok || !json.data || !json.data.length){
        daftarLayanan = [];
        renderSlide();
        return;
      }
      daftarLayanan = json.data;
      if (slideIdx >= daftarLayanan.length) slideIdx = 0;
      renderSlide();
    }catch(err){
      // Data lama tetap tampil kalau 1x polling gagal — jangan sampai layar kosong.
      console.warn('getlatestlayanan gagal:', err);
    }
  }

  function renderDots(){
    const dotsEl = document.getElementById('slideDots');
    if (daftarLayanan.length <= 1){ dotsEl.innerHTML = ''; return; }
    dotsEl.innerHTML = daftarLayanan.map(function(_, i){
      return '<span class="' + (i === slideIdx ? 'aktif' : '') + '"></span>';
    }).join('');
  }

  function renderSlide(){
    const infoBody = document.getElementById('infoBody');

    if (!daftarLayanan.length){
      infoBody.innerHTML =
        '<div class="info-body-teks"><div class="kosong">Belum ada layanan yang tersubmit hari ini.</div></div>' +
        '<div class="info-body-foto"><div class="foto-kosong">Menunggu layanan berikutnya</div></div>';
      renderDots();
      return;
    }

    const d = daftarLayanan[slideIdx];
    const fotoHtml = d.foto
      ? '<img src="' + esc(d.foto) + '" alt="Foto layanan ' + esc(d.id) + '" referrerpolicy="no-referrer">'
      : '<div class="foto-kosong">Foto belum tersedia</div>';

    infoBody.innerHTML =
      '<div class="info-body-teks">' +
        '<div class="kartu-nomor">' + esc(d.id) + '</div>' +
        '<div>' +
          '<div class="kartu-nama">' + esc(d.nama_pemohon) + '</div>' +
          '<span class="kartu-jenis">' + esc(d.jenis_label) + '</span>' +
          '<div class="kartu-waktu">Foto diupload ' + fmtWaktu(d.foto_updated_at || d.timestamp) + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="info-body-foto">' + fotoHtml + '</div>';

    renderDots();
  }

  function majuSlide(){
    if (daftarLayanan.length <= 1) return; // cuma 1 (atau 0) data, tidak perlu rotasi
    const infoBody = document.getElementById('infoBody');
    infoBody.classList.add('fading');
    setTimeout(function(){
      slideIdx = (slideIdx + 1) % daftarLayanan.length;
      renderSlide();
      infoBody.classList.remove('fading');
    }, 400);
  }

  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  refresh();
  setInterval(refresh, POLL_MS);
  setInterval(majuSlide, SLIDE_MS);

  // ── Suntik CSS ke iframe poster (aman, satu domain/same-origin) ──
  // Sembunyikan navbar, hero banner, stats-bar, dots+counter, thumbnail strip,
  // footer — supaya HANYA poster + caption nama pasangan/tanggal yang tampil,
  // memenuhi seluruh tinggi panel kanan.
  const posterFrame = document.getElementById('posterFrame');
  posterFrame.addEventListener('load', function(){
    // Selalu tampilkan iframe dulu — jangan sampai poster "hilang" hanya
    // karena penyuntikan CSS gagal (mis. dibuka via file:// sehingga
    // beda origin dan contentDocument tidak bisa diakses).
    posterFrame.classList.add('ready');
    try{
      const doc = posterFrame.contentDocument;
      if (!doc) {
        console.warn('Tidak bisa mengakses isi iframe poster (kemungkinan beda origin — buka lewat web server, bukan file:// langsung).');
        return;
      }
      const style = doc.createElement('style');
      style.textContent =
        /* Sembunyikan chrome halaman + navigasi galeri — hanya sisakan
           poster (slide aktif) dan caption nama/tanggal DI BAWAHNYA. */
        '.navbar,.hero,.stats-bar,.poster-slide-dots,.poster-slide-counter,.thumb-strip,footer{display:none!important}' +
        'html,body{background:#0B4432!important;margin:0!important;height:100%!important;overflow:hidden!important}' +
        '.container{' +
          'max-width:none!important;width:100%!important;height:100vh!important;' +
          'padding:0!important;margin:0!important;' +
          'display:flex!important;flex-direction:column!important;' +
          'align-items:center!important;justify-content:center!important;' +
        '}' +
        /* PENTING: flex-direction:column eksplisit — tanpa ini elemen di
           dalam #mainWrap (poster + info nama) berjejer ke SAMPING,
           bukan menumpuk ke bawah. */
        '#mainWrap{' +
          'width:100%!important;height:100%!important;' +
          'display:flex!important;flex-direction:column!important;' +
          'align-items:center!important;justify-content:center!important;' +
          'gap:1vh!important;' +
        '}' +
        '.poster-slide-wrap{' +
          'flex:1 1 auto!important;min-height:0!important;' +
          'width:100%!important;height:auto!important;' +
          'max-width:none!important;max-height:none!important;' +
          'aspect-ratio:auto!important;' +
          'margin:0!important;' +
          'box-shadow:0 1.5vh 4vh rgba(0,0,0,.35)!important;' +
        '}' +
        '.poster-slide-track{width:100%!important;height:100%!important}' +
        '.poster-slide-wrap img,.poster-slide-track img{' +
          'width:100%!important;height:100%!important;' +
          'object-fit:cover!important;object-position:center!important;display:block!important;' +
        '}' +
        '.poster-slide-wrap,.poster-slide-track{' +
          'background-size:cover!important;background-position:center!important;' +
        '}' +
        '.poster-info{' +
          'flex:0 0 auto!important;' +
          'max-width:94vw!important;width:100%!important;' +
          'margin:0!important;text-align:center!important;' +
        '}' +
        '.poster-info .pi-nama{font-size:1.6vw!important;color:#F4EFE2!important}' +
        '.poster-info .pi-sub{font-size:1vw!important;color:#9FC2AE!important}' +
        '.poster-info .pi-zoom-hint{display:none!important}';
      doc.head.appendChild(style);
    }catch(e){
      // Beda origin (mis. dites dari file:// lokal) — iframe tetap
      // tampil (di-set 'ready' di atas), hanya tanpa CSS full-bleed.
      console.warn('Tidak bisa suntik CSS ke iframe (kemungkinan beda origin):', e);
    }
  });
})();
</script>

</body>
</html>
