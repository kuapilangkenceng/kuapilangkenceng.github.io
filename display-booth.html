<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Display Booth — PTSP KUA Pilangkenceng</title>
<style>
  :root{
    --hijau-tua:   #0B4432;
    --hijau:       #10593F;
    --hijau-muda:  #1B7A56;
    --emas:        #C9A24B;
    --emas-terang: #E6C878;
    --krem:        #F4EFE2;
    --teks:        #F4EFE2;
    --teks-redup:  #9FC2AE;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{
    width:100vw;height:100vh;overflow:hidden;
    background:var(--hijau-tua);
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  }
  .stage{
    display:grid;
    grid-template-columns:60% 40%;
    width:100vw;height:100vh;
  }

  /* ===== KIRI — LAYANAN TERBARU + RUNNING TEXT ===== */
  .panel-info{
    position:relative;
    display:flex;flex-direction:column;
    background:
      radial-gradient(circle at 12% 8%, rgba(230,200,120,0.10), transparent 45%),
      linear-gradient(200deg, var(--hijau) 0%, var(--hijau-tua) 65%);
    overflow:hidden;
    border-right:3px solid var(--emas);
  }
  .panel-info::before{
    content:"";
    position:absolute;inset:0;
    opacity:.05;
    background-image:
      repeating-radial-gradient(circle at 0 0, transparent 0, transparent 38px, var(--emas-terang) 39px, transparent 40px);
    background-size:80px 80px;
    pointer-events:none;
  }

  .info-header{
    padding:2.2vh 2.2vw 1.4vh;
    border-bottom:1px solid rgba(230,200,120,0.25);
    position:relative;z-index:1;
  }
  .info-eyebrow{
    display:flex;align-items:center;gap:.6vw;
    font-size:1vw;letter-spacing:.18em;text-transform:uppercase;
    color:var(--emas-terang);font-weight:600;
  }
  .dot-live{
    width:.65vw;height:.65vw;border-radius:50%;
    background:var(--emas-terang);
    box-shadow:0 0 0 0 rgba(230,200,120,.6);
    animation:pulse 1.8s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(230,200,120,.55)}
    70%{box-shadow:0 0 0 .8vw rgba(230,200,120,0)}
    100%{box-shadow:0 0 0 0 rgba(230,200,120,0)}
  }
  .info-title{
    margin-top:.6vh;
    font-size:1.9vw;font-weight:700;color:var(--teks);
    letter-spacing:.01em;
  }
  .info-sub{
    margin-top:.3vh;font-size:.9vw;color:var(--teks-redup);font-weight:400;
  }

  .info-body{
    flex:1;display:flex;flex-direction:column;justify-content:center;
    padding:2vh 2.2vw;position:relative;z-index:1;gap:2.4vh;
  }
  .kartu-nomor{
    font-size:3.2vw;font-weight:800;color:var(--emas-terang);
    line-height:1;letter-spacing:.01em;
    text-shadow:0 0.2vh 1.2vh rgba(230,200,120,.25);
  }
  .kartu-nama{
    font-size:1.8vw;font-weight:700;color:var(--teks);line-height:1.25;
  }
  .kartu-jenis{
    display:inline-block;
    margin-top:.5vh;
    padding:.6vh 1vw;
    font-size:.95vw;font-weight:600;color:var(--hijau-tua);
    background:var(--emas-terang);
    border-radius:999px;
  }
  .kartu-waktu{
    font-size:.85vw;color:var(--teks-redup);margin-top:.7vh;
  }

  .marquee-wrap{
    border-top:1px solid rgba(230,200,120,0.25);
    background:rgba(0,0,0,0.18);
    padding:1.6vh 0;
    overflow:hidden;
    position:relative;z-index:1;
    white-space:nowrap;
  }
  .marquee-track{
    display:inline-block;
    padding-left:100%;
    animation:scroll-left 20s linear infinite;
    font-size:1.25vw;font-weight:600;color:var(--teks);
    letter-spacing:.01em;
  }
  .marquee-track b{color:var(--emas-terang);font-weight:800}
  @keyframes scroll-left{
    0%{transform:translateX(0)}
    100%{transform:translateX(-100%)}
  }

  .clock{
    position:absolute;top:2.2vh;right:2.2vw;z-index:2;
    text-align:right;font-variant-numeric:tabular-nums;
  }
  .clock .jam{font-size:1.3vw;font-weight:700;color:var(--emas-terang)}
  .clock .tgl{font-size:.7vw;color:var(--teks-redup)}

  .kosong{
    font-size:1.2vw;color:var(--teks-redup);font-style:italic;
  }

  /* ===== KANAN — POSTER (iframe, chrome disembunyikan via injeksi CSS) ===== */
  .panel-poster{
    position:relative;
    background:var(--hijau-tua);
    display:flex;align-items:center;justify-content:center;
  }
  .panel-poster iframe{
    width:100%;height:100%;border:0;display:block;
    opacity:0;transition:opacity .5s ease;
  }
  .panel-poster iframe.ready{opacity:1}

  @media (max-width:900px){
    .stage{grid-template-columns:1fr}
    .panel-info{height:40vh}
    .panel-poster{height:60vh}
  }
</style>
</head>
<body>

<div class="stage">

  <!-- KIRI: Layanan terbaru + running text -->
  <section class="panel-info">
    <div class="clock">
      <div class="jam" id="jamSkrg">--:--</div>
      <div class="tgl" id="tglSkrg">-</div>
    </div>

    <div class="info-header">
      <div class="info-eyebrow"><span class="dot-live"></span> Sedang Dilayani</div>
      <div class="info-title">PTSP KUA Pilangkenceng</div>
      <div class="info-sub">Layanan terbaru diperbarui otomatis</div>
    </div>

    <div class="info-body" id="infoBody">
      <div class="kosong">Memuat data layanan…</div>
    </div>

    <div class="marquee-wrap">
      <div class="marquee-track" id="marqueeText">Memuat informasi layanan…</div>
    </div>
  </section>

  <!-- KANAN: Poster Pengumuman Kehendak Nikah (halaman publik yang sudah ada) -->
  <section class="panel-poster">
    <iframe
      id="posterFrame"
      src="pengumumankehendaknikah.html"
      title="Poster Pengumuman Kehendak Nikah"
      loading="eager"></iframe>
  </section>

</div>

<script>
(function(){
  // ── ID deployment TERVERIFIKASI dari config production (pengumumankehendaknikah.html) ──
  const API_URL = 'https://script.google.com/macros/s/AKfycbzJNO6PqGKH5AGpnaK_yJXPvqpdoVAkHpFZAVGXF57vDD8VavkCOG0smsF56nWquX3b/exec';
  const POLL_MS = 15000;

  function tickClock(){
    const now = new Date();
    document.getElementById('jamSkrg').textContent =
      now.toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit' });
    document.getElementById('tglSkrg').textContent =
      now.toLocaleDateString('id-ID', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
  }
  tickClock();
  setInterval(tickClock, 15000);

  async function fetchJsonRetry(url, tries){
    tries = tries || 2;
    for (let i = 0; i < tries; i++){
      try{
        const res = await fetch(url + (url.indexOf('?') > -1 ? '&' : '?') + '_=' + Date.now(), { cache:'no-store' });
        const text = await res.text();
        return JSON.parse(text);
      }catch(err){
        if (i === tries - 1) throw err;
        await new Promise(r => setTimeout(r, 1200));
      }
    }
  }

  function fmtWaktu(iso){
    if (!iso) return '';
    try{
      const d = new Date(iso);
      return d.toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit' }) + ' WIB';
    }catch(e){ return ''; }
  }

  let lastId = null;

  async function refresh(){
    try{
      const json = await fetchJsonRetry(API_URL + '?action=getlatestlayanan');
      if (!json || !json.ok || !json.data){ renderKosong(); return; }
      renderData(json.data);
    }catch(err){
      console.warn('getlatestlayanan gagal:', err);
    }
  }

  function renderKosong(){
    document.getElementById('infoBody').innerHTML =
      '<div class="kosong">Belum ada layanan yang tersubmit hari ini.</div>';
    document.getElementById('marqueeText').innerHTML =
      'Selamat datang di PTSP KUA Kecamatan Pilangkenceng — Silakan ambil nomor layanan di meja petugas';
  }

  function renderData(d){
    document.getElementById('infoBody').innerHTML =
      '<div class="kartu-nomor">' + esc(d.id) + '</div>' +
      '<div>' +
        '<div class="kartu-nama">' + esc(d.nama_pemohon) + '</div>' +
        '<span class="kartu-jenis">' + esc(d.jenis_label) + '</span>' +
        '<div class="kartu-waktu">Diterima ' + fmtWaktu(d.timestamp) + '</div>' +
      '</div>';

    document.getElementById('marqueeText').innerHTML =
      '<b>' + esc(d.id) + '</b> &nbsp;•&nbsp; ' + esc(d.nama_pemohon) +
      ' &nbsp;•&nbsp; ' + esc(d.jenis_label) +
      ' &nbsp;•&nbsp; Selamat datang di PTSP KUA Kecamatan Pilangkenceng &nbsp;•&nbsp; ';

    if (d.id !== lastId){
      const track = document.getElementById('marqueeText');
      track.style.animation = 'none';
      void track.offsetWidth;
      track.style.animation = '';
      lastId = d.id;
    }
  }

  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  refresh();
  setInterval(refresh, POLL_MS);

  // ── Suntik CSS ke iframe poster (aman, satu domain/same-origin) ──
  // Sembunyikan navbar, hero banner, stats-bar, dots+counter, thumbnail strip,
  // footer — supaya HANYA poster + caption nama pasangan/tanggal yang tampil,
  // memenuhi seluruh tinggi panel kanan.
  const posterFrame = document.getElementById('posterFrame');
  posterFrame.addEventListener('load', function(){
    try{
      const doc = posterFrame.contentDocument;
      if (!doc) return;
      const style = doc.createElement('style');
      style.textContent =
        '.navbar,.hero,.stats-bar,.poster-slide-dots,.poster-slide-counter,.thumb-strip,footer{display:none!important}' +
        'body{background:#0B4432!important;margin:0!important}' +
        '.container{max-width:none!important;padding:0!important;min-height:100vh;display:flex;align-items:center;justify-content:center}' +
        '#mainWrap{width:100%;display:flex;justify-content:center}' +
        '.poster-slide-wrap{max-width:min(86%,64vh)!important;width:100%!important;box-shadow:0 1.5vh 4vh rgba(0,0,0,.35)!important}' +
        '.poster-info{max-width:min(86%,64vh)!important;margin-top:1.6vh!important}' +
        '.poster-info .pi-nama{font-size:1.5vw!important;color:#F4EFE2!important}' +
        '.poster-info .pi-sub{font-size:.95vw!important;color:#9FC2AE!important}' +
        '.poster-info .pi-zoom-hint{display:none!important}';
      doc.head.appendChild(style);
      posterFrame.classList.add('ready');
    }catch(e){
      // Beda origin (mis. dites dari file:// lokal) — biarkan tampil apa adanya.
      console.warn('Tidak bisa suntik CSS ke iframe (kemungkinan beda origin):', e);
      posterFrame.classList.add('ready');
    }
  });
})();
</script>

</body>
</html>
