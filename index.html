<!DOCTYPE html>
<html lang="id">
<head>
  <!-- Config global KUA -->
  <script src="https://kuapilangkenceng.github.io/config.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KUA Kecamatan Pilangkenceng — Kantor Urusan Agama</title>
  <meta name="description" content="Website resmi KUA Kecamatan Pilangkenceng, Kabupaten Madiun. Layanan pernikahan, wakaf, kepenghuluan, dan keagamaan untuk masyarakat.">
  <meta name="keywords" content="KUA Pilangkenceng, Kantor Urusan Agama, Nikah, Wakaf, Madiun, PTSP Digital">
  <meta property="og:title" content="KUA Kecamatan Pilangkenceng">
  <meta property="og:description" content="Melayani Umat dengan Ikhlas dan Profesional — KUA Kecamatan Pilangkenceng, Kab. Madiun">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://kuapilangkenceng.github.io">
  <link rel="canonical" href="https://kuapilangkenceng.github.io">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --hijau-tua: #1b5e35;
      --hijau: #237a3e;
      --hijau-muda: #2ea04f;
      --hijau-terang: #eaf5ee;
      --hijau-border: #c3dfc9;
      --emas: #c9a030;
      --emas-muda: #fdf3dc;
      --putih: #ffffff;
      --abu: #f4f6f4;
      --teks: #1a2b1e;
      --teks-abu: #536356;
      --teks-ringan: #8fa392;
      --font: 'Plus Jakarta Sans', sans-serif;
      --font-display: 'Playfair Display', serif;
      --radius: 10px;
      --radius-lg: 14px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: var(--font); color: var(--teks); background: var(--putih); font-size: 14px; line-height: 1.65; }
    img { max-width: 100%; display: block; }
    a { text-decoration: none; color: inherit; }

    /* ── NAVBAR ── */
    .navbar {
      background: var(--hijau-tua);
      position: sticky; top: 0; z-index: 1000;
      border-bottom: 2px solid rgba(201,160,48,0.4);
    }
    .navbar-inner {
      max-width: 1200px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 1.5rem; height: 64px;
    }
    .nav-brand { display: flex; align-items: center; gap: 10px; }
    .nav-logo {
      width: 42px; height: 42px; border-radius: 50%;
      background: var(--emas); display: flex; align-items: center; justify-content: center;
      font-size: 20px; flex-shrink: 0;
    }
    .nav-brand-text strong { display: block; font-size: 13px; font-weight: 700; color: #fff; line-height: 1.25; }
    .nav-brand-text span { font-size: 10px; color: rgba(255,255,255,0.6); }
    .nav-links { display: flex; align-items: center; gap: 1.25rem; }
    .nav-links a {
      color: rgba(255,255,255,0.8); font-size: 13px; font-weight: 500;
      padding: 4px 0; border-bottom: 2px solid transparent; transition: all .2s;
    }
    .nav-links a:hover, .nav-links a.active { color: var(--emas); border-bottom-color: var(--emas); }

    /* ── DROPDOWN LAYANAN ── */
    .nav-dropdown { position: relative; }
    .nav-dropdown-toggle {
      color: rgba(255,255,255,0.8); font-size: 13px; font-weight: 500;
      padding: 4px 0; border-bottom: 2px solid transparent; transition: all .2s;
      background: none; border-top: none; border-left: none; border-right: none;
      cursor: pointer; display: flex; align-items: center; gap: 4px; font-family: var(--font);
    }
    .nav-dropdown-toggle:hover, .nav-dropdown.open .nav-dropdown-toggle {
      color: var(--emas); border-bottom-color: var(--emas);
    }
    .nav-dropdown-toggle .dd-arrow {
      font-size: 9px; transition: transform .2s; display: inline-block;
    }
    .nav-dropdown.open .dd-arrow { transform: rotate(180deg); }
    .nav-dropdown-menu {
      position: absolute; top: calc(100% + 14px); left: 50%; transform: translateX(-50%);
      background: var(--putih); border-radius: var(--radius-lg);
      box-shadow: 0 8px 32px rgba(0,0,0,0.18); min-width: 220px;
      border: 1px solid var(--hijau-border); overflow: hidden;
      opacity: 0; pointer-events: none; transform: translateX(-50%) translateY(-6px);
      transition: opacity .2s, transform .2s;
    }
    .nav-dropdown.open .nav-dropdown-menu {
      opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0);
    }
    .dd-section-label {
      font-size: 9.5px; font-weight: 700; color: var(--teks-ringan);
      letter-spacing: .6px; padding: 8px 14px 4px; text-transform: uppercase;
    }
    .dd-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 14px; font-size: 12.5px; font-weight: 500; color: var(--teks);
      transition: background .15s; text-decoration: none; border-bottom: none;
    }
    .dd-item:hover { background: var(--hijau-terang); color: var(--hijau-tua); }
    .dd-item.dd-active { color: var(--hijau); font-weight: 600; }
    .dd-item-icon { font-size: 16px; width: 24px; text-align: center; flex-shrink: 0; }
    .dd-item-text strong { display: block; font-size: 12px; font-weight: 600; color: inherit; line-height: 1.2; }
    .dd-item-text span { font-size: 10.5px; color: var(--teks-abu); }
    .dd-badge-soon {
      margin-left: auto; font-size: 9px; font-weight: 700;
      background: #fff3e0; color: #b45309; border: 1px solid #fbbf24;
      padding: 1px 6px; border-radius: 10px; white-space: nowrap; flex-shrink: 0;
    }
    .dd-divider { height: 1px; background: var(--hijau-border); margin: 4px 0; }
    .btn-ptsp {
      background: var(--emas); color: var(--hijau-tua);
      padding: 8px 16px; border-radius: 8px; font-size: 12.5px; font-weight: 700;
      display: flex; align-items: center; gap: 6px; border: none; cursor: pointer;
      transition: opacity .2s; white-space: nowrap;
    }
    .btn-ptsp:hover { opacity: .88; }

    /* ── HERO ── */
    .hero {
      position: relative; overflow: hidden;
      min-height: 520px; display: flex; align-items: center;
      width: 100%; box-sizing: border-box;
    }

    /* SLIDESHOW BACKGROUND FULLSCREEN */
    .hero-slideshow {
      position: absolute; inset: 0; z-index: 0;
    }
    .hero-slide {
      position: absolute; inset: 0;
      background-size: cover; background-position: center;
      opacity: 0; transition: opacity 1s ease;
    }
    .hero-slide.active { opacity: 1; }
    /* Overlay gradasi kiri agar teks terbaca */
    .hero-overlay {
      position: absolute; inset: 0; z-index: 1;
      background: linear-gradient(
        to right,
        rgba(10,40,20,0.88) 0%,
        rgba(10,40,20,0.75) 35%,
        rgba(10,40,20,0.35) 65%,
        rgba(0,0,0,0.1) 100%
      );
    }
    .hero-bg { display: none; }
    .hero-pattern { display: none; }
    .hero-inner {
      max-width: 1200px; margin: 0 auto; padding: 4rem 1.5rem;
      display: flex; flex-direction: column; justify-content: center;
      position: relative; z-index: 2; width: 100%;
    }
    /* Caption foto di pojok kanan bawah */
    .hero-photo-caption {
      position: absolute; bottom: 1.5rem; right: 1.5rem; z-index: 3;
      background: rgba(0,0,0,0.45); backdrop-filter: blur(4px);
      color: rgba(255,255,255,0.85); font-size: 11px; font-weight: 500;
      padding: 4px 12px; border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.15);
      transition: opacity .3s;
    }
    /* Dots slideshow */
    .hero-dots {
      position: absolute; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
      z-index: 3; display: flex; gap: 6px;
    }
    .hero-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: rgba(255,255,255,0.35); border: none; padding: 0; cursor: pointer;
      transition: background .3s, transform .3s;
    }
    .hero-dot.active { background: var(--emas); transform: scale(1.3); }
    .hero-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(201,160,48,0.2); border: 1px solid rgba(201,160,48,0.45);
      color: var(--emas); padding: 4px 14px; border-radius: 20px;
      font-size: 11px; font-weight: 600; letter-spacing: .5px; margin-bottom: 1rem;
    }
    .hero h1 {
      font-family: var(--font-display); color: #fff;
      font-size: 2.6rem; line-height: 1.2; margin-bottom: .75rem;
    }
    .hero-tagline {
      color: var(--emas); font-style: italic; font-size: 1rem;
      font-weight: 500; margin-bottom: 1rem;
    }
    .hero p { color: rgba(255,255,255,0.75); font-size: 13.5px; margin-bottom: 1.75rem; max-width: 440px; }
    .hero-btns { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn-hero-primary {
      background: var(--emas); color: var(--hijau-tua);
      padding: 11px 22px; border-radius: 8px; font-weight: 700; font-size: 13px;
      display: inline-flex; align-items: center; gap: 7px; transition: opacity .2s;
    }
    .btn-hero-primary:hover { opacity: .88; }
    .btn-hero-outline {
      background: transparent; color: #fff;
      padding: 11px 22px; border-radius: 8px; font-weight: 600; font-size: 13px;
      border: 1.5px solid rgba(255,255,255,0.45); transition: border-color .2s;
      display: inline-flex; align-items: center; gap: 7px;
    }
    .btn-hero-outline:hover { border-color: rgba(255,255,255,0.8); }
    .hero-stats { display: flex; gap: 2rem; margin-top: 2rem; }
    .hero-stat strong { display: block; font-size: 1.6rem; font-weight: 700; color: var(--emas); }
    .hero-stat span { font-size: 11px; color: rgba(255,255,255,0.6); }
    .hero-card {
      background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
      border-radius: var(--radius-lg); padding: 1.5rem; backdrop-filter: blur(4px);
    }
    .kepala-info { display: flex; align-items: center; gap: 12px; margin-bottom: 1rem; }
    .kepala-avatar {
      width: 52px; height: 52px; border-radius: 50%;
      background: var(--emas); display: flex; align-items: center; justify-content: center;
      font-size: 22px; flex-shrink: 0;
    }
    .kepala-info h3 { color: #fff; font-size: 14px; font-weight: 700; line-height: 1.3; }
    .kepala-info span { color: rgba(255,255,255,0.6); font-size: 11px; }
    .hero-contact-list { list-style: none; }
    .hero-contact-list li {
      display: flex; align-items: flex-start; gap: 8px;
      color: rgba(255,255,255,0.75); font-size: 12px; padding: 4px 0;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .hero-contact-list li:last-child { border-bottom: none; }
    .hero-contact-list .ic { color: var(--emas); font-size: 13px; margin-top: 1px; flex-shrink: 0; }
    .jam-box {
      margin-top: 1rem; background: rgba(201,160,48,0.12);
      border: 1px solid rgba(201,160,48,0.3); border-radius: 8px; padding: 10px 12px;
    }
    .jam-box p { color: var(--emas); font-size: 11px; font-weight: 600; margin-bottom: 4px; }
    .jam-row { display: flex; justify-content: space-between; font-size: 11px; color: rgba(255,255,255,0.7); padding: 2px 0; }

    /* ── HERO SLIDESHOW FULLSCREEN ── */
  (function() {
    var slides = document.querySelectorAll('#heroSlideshow .hero-slide');
    var dotsEl = document.getElementById('heroDots');
    var capEl  = document.getElementById('heroCaption');
    if (!slides.length || !dotsEl) return;
    var cur = 0;
    slides.forEach(function(_, i) {
      var d = document.createElement('button');
      d.className = 'hero-dot' + (i === 0 ? ' active' : '');
      d.setAttribute('aria-label', 'Slide ' + (i+1));
      d.onclick = function() { goTo(i); };
      dotsEl.appendChild(d);
    });
    function goTo(n) {
      slides[cur].classList.remove('active');
      dotsEl.children[cur].classList.remove('active');
      cur = (n + slides.length) % slides.length;
      slides[cur].classList.add('active');
      dotsEl.children[cur].classList.add('active');
      if (capEl) capEl.textContent = slides[cur].getAttribute('data-caption') || '';
    }
    setInterval(function() { goTo(cur + 1); }, 4000);
  })();

  /* ── INIT ── */
  window.addEventListener('load', () => {
    loadArtikel();
    loadPengumuman();
    setTimeout(() => {
      animCount('s1', 187, '', 1400);
      animCount('s2', 524, '', 1400);
      animCount('s3', 98, '%', 1200);
      animCount('s4', 18, '', 900);
    }, 400);
  });

  /* ── HAMBURGER MENU ── */
  (function() {
    var btn = document.getElementById('hamburgerBtn');
    var links = document.querySelector('.nav-links');
    if (!btn || !links) return;
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      links.classList.toggle('open');
    });
    document.addEventListener('click', function(e) {
      if (!links.contains(e.target) && e.target !== btn) {
        links.classList.remove('open');
      }
    });
  })();

  /* ── ACTIVE NAV ON SCROLL ── */
  const sections = document.querySelectorAll('section[id], div[id]');
  const navLinks = document.querySelectorAll('.nav-links a');
  window.addEventListener('scroll', () => {
    let cur = '';
    sections.forEach(s => { if (window.scrollY >= s.offsetTop - 80) cur = s.id; });
    navLinks.forEach(a => {
      a.classList.toggle('active', a.getAttribute('href') === '#' + cur);
    });
  });
</script>

</body>
</html>
